<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="这一百年">
  <!-- 朱砂石印主体（克制哑光方印） -->
  <rect x="2" y="2" width="60" height="60" rx="10.5" fill="#B53426"/>

  <!-- 传统古籍书牌委角内框（纯路径偶奇填充，任意渲染器零锯齿伪影） -->
  <path fill="#FBF4E6" fill-opacity="0.42" fill-rule="evenodd" d="
    M12.5 7.5 H51.5 L56.5 12.5 V51.5 L51.5 56.5 H12.5 L7.5 51.5 V12.5 Z
    M13.2 9.0 L9.0 13.2 V50.8 L13.2 55.0 H50.8 L55.0 50.8 V13.2 L50.8 9.0 Z
  "/>

  <!-- 左右世纪刻度微菱（1926 · 2025） -->
  <polygon points="8.25,29.8 10.2,32 8.25,34.2 6.3,32" fill="#FBF4E6" fill-opacity="0.72"/>
  <polygon points="55.75,29.8 57.7,32 55.75,34.2 53.8,32" fill="#FBF4E6" fill-opacity="0.72"/>

  <!-- 定制宋体印章「百」字标 -->
  <!-- 顶横「一」：带克制宋韵右肩 -->
  <path d="M15.8 18.2 H44.2 L46.0 16.5 L48.4 18.8 V21.9 H15.8 Z" fill="#FBF4E6"/>
  <!-- 承接撇「丿」 -->
  <path d="M30.1 21.5 H34.7 L31.3 28.4 H27.2 Z" fill="#FBF4E6"/>
  <!-- 中宫「日」：两竖略出脚（经典宋刻书版气韵） -->
  <path fill="#FBF4E6" fill-rule="evenodd" d="
    M19.8 27.6 H44.2 V51.2 H39.8 V49.2 H24.2 V51.2 H19.8 Z
    M24.2 31.2 V37.2 H39.8 V31.2 Z
    M24.2 40.2 V45.8 H39.8 V40.2 Z
  "/>
</svg>
