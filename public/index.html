<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>这一百年</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>

<header id="top">
  <h1><span class="t1">这</span><span class="t2">一百年</span></h1>
  <nav>
    <button data-go="pick" class="on">挑一年</button>
    <button data-go="board">排行榜</button>
    <button data-go="mine">我的局</button>
  </nav>
</header>

<main>

<!-- 挑一年 -->
<section id="s-pick" class="screen on">
  <p class="lede">
    挑一年，挑一个月，落进那时候的中国，过三十天。
    每天写下你要做的事，看这个世界怎么回你。
    三十天后算账：你赚到的钱，相当于那一年一个普通人多少年的收入。
  </p>
  <div id="grid" class="grid"><p class="wait">正在读一百年…</p></div>
  <p class="foot">
    格子下面那道红杠越深，那一年能挣到的越多——<span class="nowrap">但挣得多不等于好挣。</span>
    右上角有个蓝点的年份，<span class="nowrap">那一年会换钱。</span>
  </p>
</section>

<!-- 一年的详情 + 选月 -->
<section id="s-year" class="screen">
  <button class="back" data-go="pick">← 换一年</button>
  <div id="year-head"></div>
  <div id="year-body"></div>
  <h3 class="mh">从哪个月开始</h3>
  <p class="hint">同一年里，月份差得很远。选定就从那个月 1 号走到 30 号。</p>
  <div id="months" class="months"></div>
  <div id="start-box" class="start-box" hidden>
    <label>叫什么名字 <input id="nick" maxlength="16" placeholder="留个名号上榜"></label>
    <button id="start" class="primary">进去</button>
  </div>
</section>

<!-- 玩 -->
<section id="s-play" class="screen">
  <div id="play-bar" class="bar"></div>
  <details id="ref" class="ref"><summary>翻一下这一年：物价、能干什么、不能干什么</summary><div id="ref-body"></div></details>
  <div id="play-story" class="story"></div>
  <div id="play-write" class="write">
    <label for="list" id="write-label">今天打算做什么</label>
    <textarea id="list" rows="7" placeholder="写下来，越具体越有用。&#10;比如：早上去码头等活，问工头能不能预支半天工钱；&#10;中午去当铺问问那块表能当多少；&#10;晚上找同乡打听哪里招人。"></textarea>
    <div class="write-foot">
      <span id="count" class="count">0 / 500</span>
      <button id="send" class="primary">过完这一天</button>
    </div>
  </div>
  <details id="ledger" class="ledger"><summary>这几天的账</summary><div id="ledger-body"></div></details>
</section>

<!-- 结算 -->
<section id="s-done" class="screen">
  <div id="done-body"></div>
  <div class="done-acts">
    <button class="primary" data-go="pick">再来一局</button>
    <button data-go="board">看排行榜</button>
  </div>
  <div id="done-days"></div>
</section>

<!-- 排行榜 -->
<section id="s-board" class="screen">
  <h2>排行榜</h2>
  <p class="hint" id="board-note"></p>
  <div id="board-tabs" class="tabs"></div>
  <div id="board-body"></div>
</section>

<!-- 我的局 -->
<section id="s-mine" class="screen">
  <h2>我的局</h2>
  <div id="mine-body"></div>
</section>

</main>

<div id="toast" class="toast" hidden></div>

<script src="/app.js"></script>
</body>
</html>
